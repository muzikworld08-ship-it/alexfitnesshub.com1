    <script>
      (function() {
        var isBenign = function(msg) {
          if (!msg) return false;
          var str = typeof msg === "string" ? msg : (msg.message || msg.stack || JSON.stringify(msg) || String(msg));
          var lower = str.toLowerCase();
          var matched = (
            lower.includes("resource_exhausted") ||
            lower.includes("resource-exhausted") ||
            lower.includes("quota limit exceeded") ||
            lower.includes("quota exceeded") ||
            lower.includes("free daily write units") ||
            lower.includes("free tier database") ||
            lower.includes("rpc 'write' stream") ||
            lower.includes("code: 8 message: 8") ||
            lower.includes("code: 8") ||
            lower.includes("disconnecting idle stream") ||
            lower.includes("timed out waiting for new targets") ||
            lower.includes("rpc 'listen' stream") ||
            lower.includes("code: 1 message: 1 cancelled")
          );
          if (matched) {
            window.__AFH_SYNC_DEGRADED__ = true;
          }
          return matched;
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenign(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenign(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener("error", function(e) {
          if (isBenign(e.message) || isBenign(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          if (isBenign(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <script>
      // Build Hash Version Identifier - Unified Single Codebase
      window.__APP_BUILD_ID__ = "__BUILD_ID__";

      // Immediate cache purge on version update across mobile and desktop
      (function() {
        var CURRENT_VERSION = "__BUILD_ID__";
        try {
          var stored = localStorage.getItem("afh_build_version");
          if (stored !== CURRENT_VERSION) {
            console.log("[Version Sync] New deployment detected (" + CURRENT_VERSION + "). Purging stale caches...");
            localStorage.setItem("afh_build_version", CURRENT_VERSION);
            if ("caches" in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
          }
        } catch (e) {}
      })();

      // Service Worker Handling: ensure immediate update across all mobile and desktop devices
      if ("serviceWorker" in navigator) {
        const isDevHost = window.location.hostname === "localhost" || 
                          window.location.hostname.includes("ais-dev") ||
                          window.location.hostname.includes("ais-pre") ||
                          window.location.hostname.includes("webcontainer");
        
        if (isDevHost) {
          // In development/preview container, unregister any stale workers
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const reg of registrations) {
              reg.unregister();
            }
          });
        } else {
          let refreshing = false;
          // Auto-reload the page when a new service worker activates and claims the client (at most once per session)
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (!refreshing) {
              const sessionFlag = sessionStorage.getItem("afh_sw_reloaded");
              if (!sessionFlag) {
                refreshing = true;
                sessionStorage.setItem("afh_sw_reloaded", "1");
                console.log("[Service Worker] New version activated. Reloading page for newest build...");
                window.location.reload();
              }
            }
          });

          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/service-worker.js").then((registration) => {
              // Immediately check for updates
              registration.update();
              console.log("[Service Worker] Registered with scope:", registration.scope);

              // Detect when an updated service worker is being installed
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === "installed" && navigator.serviceWorker.controller) {
                      console.log("[Service Worker] New update found. Prompting immediate activation...");
                      installingWorker.postMessage({ type: "SKIP_WAITING" });
                    }
                  };
                }
              };

              // Re-check for new deploys when user switches back to this tab/app on mobile
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                  registration.update();
                }
              });
              window.addEventListener("focus", () => registration.update());
            }).catch((err) => {
              console.warn("[Service Worker] Registration failed:", err);
            });
          });
        }
      }

      // Recover gracefully from stale Vite dynamic chunk load errors after new deployments
      window.addEventListener("error", (e) => {
        const msg = ((e && e.message) || "").toLowerCase();
        if (
          msg.includes("failed to fetch dynamically imported module") ||
          msg.includes("error loading dynamically imported module") ||
          msg.includes("loading chunk")
        ) {
          const key = "afh_stale_chunk_reload";
          const last = parseInt(sessionStorage.getItem(key) || "0", 10);
          if (Date.now() - last > 8000) {
            sessionStorage.setItem(key, Date.now().toString());
            console.warn("[AFH Build Sync] Stale chunk detected after deployment. Reloading...");
            window.location.reload();
          }
        }
      });

      // Force pure white light theme across all devices
      try {
        localStorage.setItem("fit_theme", "light");
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>

    <!-- Defensive polyfill for Tawk.to i18next to prevent third-party script crashes -->
    <script type="text/javascript">
      (function() {
        var fallbackI18n = function(key, opts) {
          if (typeof key === 'string') return key;
          return '';
        };
        fallbackI18n.t = function(k) { return k; };
        fallbackI18n.exists = function() { return true; };
        fallbackI18n.changeLanguage = function(l, cb) { if (cb) cb(); return Promise.resolve(); };

        window.$_Tawk = window.$_Tawk || {};
        window.$_Tawk.i18next = fallbackI18n;

        // Catch and suppress unhandled third-party tawk script errors
        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('i18next') !== -1 || event.message.indexOf('Tawk') !== -1 || (event.filename && event.filename.indexOf('tawk.to') !== -1))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <!--Start of Tawk.to Script (Lazy loaded to accelerate initial page speed)-->
    <script type="text/javascript">
      (function(){
        window.Tawk_API = window.Tawk_API || {};
        window.Tawk_LoadStart = new Date();
        var tawkLoaded = false;
        function loadTawk() {
          if (tawkLoaded) return;
          tawkLoaded = true;
          var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
          s1.async = true;
          s1.src = 'https://embed.tawk.to/6a967a9e19d20834439c4ed8/1k1dstuuo';
          s1.charset = 'UTF-8';
          s1.setAttribute('crossorigin','*');
          s0.parentNode.insertBefore(s1, s0);
        }

        // Defer until browser is idle or user scrolls/taps
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(function() { setTimeout(loadTawk, 2500); }, { timeout: 4000 });
        } else {
          setTimeout(loadTawk, 3000);
        }

        window.addEventListener('scroll', loadTawk, { once: true, passive: true });
        window.addEventListener('click', loadTawk, { once: true, passive: true });
        window.addEventListener('touchstart', loadTawk, { once: true, passive: true });
      })();
    </script>
    <!--End of Tawk.to Script-->

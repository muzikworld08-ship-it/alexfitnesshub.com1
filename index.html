    <script>
      // Build Hash Version Identifier
      window.__APP_BUILD_ID__ = "2.5.0-20260728-RELEASE";

      // 1. Build Version Sanity Check & Hard Refresh Trigger
      (function() {
        try {
          var activeBuild = window.__APP_BUILD_ID__;
          var storedBuild = localStorage.getItem("app_active_build_id");

          if (storedBuild && storedBuild !== activeBuild) {
            console.warn("[DevOps Sync] Stale build ID detected:", storedBuild, "-> New:", activeBuild);
            localStorage.setItem("app_active_build_id", activeBuild);

            // Flush all cache storage
            if ("caches" in window) {
              caches.keys().then(function(names) {
                for (var name of names) {
                  caches.delete(name);
                }
              });
            }

            // Force hard refresh immediately to load newest bundles
            window.location.reload(true);
            return;
          } else {
            localStorage.setItem("app_active_build_id", activeBuild);
          }

          // Cross-verify with Manifest version
          fetch("/manifest.json?t=" + Date.now(), { cache: "no-store" })
            .then(function(res) { return res.json(); })
            .then(function(manifest) {
              if (manifest && manifest.version && manifest.version !== activeBuild) {
                console.warn("[DevOps Sync] Manifest version mismatch:", manifest.version, "vs Active:", activeBuild);
                window.location.reload(true);
              }
            })
            .catch(function(err) { /* silent catch */ });
        } catch (e) {
          console.error("[DevOps Sync] Build verification error:", e);
        }
      })();

      // 2. Register Service Worker with active client claiming & skipWaiting
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js?v=' + window.__APP_BUILD_ID__).then(function(registration) {
            console.log('[DevOps SW] Registered with build:', window.__APP_BUILD_ID__);
            
            // Check for service worker updates
            registration.update();

            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[DevOps SW] New ServiceWorker installed. Instructing skipWaiting...');
                    newWorker.postMessage('SKIP_WAITING');
                  }
                });
              }
            });
          }).catch(function(err) {
            console.log('[DevOps SW] Registration failed:', err);
          });
        });
        
        // Force hard refresh when new controlling service worker takes over clients
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isReloading) {
            isReloading = true;
            console.log('[DevOps SW] Controller changed. Executing hard reload...');
            window.location.reload(true);
          }
        });

        // Unregister any legacy non-matching service workers
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var reg = registrations[i];
            if (reg.active && !reg.active.scriptURL.includes('/sw.js')) {
              reg.unregister().then(function(success) {
                if (success) console.log('[DevOps SW Cleanup] Unregistered outdated SW:', reg.scope);
              });
            }
          }
        });
      }

      // Force pure white light theme across all devices
      try {
        localStorage.setItem("fit_theme", "light");
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>

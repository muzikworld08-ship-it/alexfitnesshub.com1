    <script>
      // Build Hash Version Identifier
      window.__APP_BUILD_ID__ = "2.6.0-20260903-RELEASE";

      // Service Worker Handling: avoid cache conflicts in dev/preview environments
      if ("serviceWorker" in navigator) {
        const isDevHost = window.location.hostname === "localhost" || 
                          window.location.hostname.includes("ais-dev") ||
                          window.location.hostname.includes("run.app");
        
        if (isDevHost) {
          // In development/preview container, unregister any stale workers to prevent blank-screen cache locking
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const reg of registrations) {
              reg.unregister();
            }
          });
        } else {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/service-worker.js").then((registration) => {
              console.log("[Service Worker] Registered with scope:", registration.scope);
            }).catch((err) => {
              console.warn("[Service Worker] Registration failed:", err);
            });
          });
        }
      }

      // Force pure white light theme across all devices
      try {
        localStorage.setItem("fit_theme", "light");
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
